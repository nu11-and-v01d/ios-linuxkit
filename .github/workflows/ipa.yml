name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install meson ninja
      - name: Build iSH application
        run: |
          xcodebuild -project iSH.xcodeproj -scheme iSH \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/iSH.app"
          test -d "$app"
          rm -rf Payload iSH.ipa
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry iSH.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: iSH.ipa
